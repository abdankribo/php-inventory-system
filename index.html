<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stockroom</title><style>:root{--a:#f43f5e}*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f7f8fb;font:15px Inter,system-ui,sans-serif}header{position:sticky;top:0;background:#08090dee;backdrop-filter:blur(12px);border-bottom:1px solid #282e38;padding:16px 5vw;display:flex;justify-content:space-between;gap:20px;align-items:center}.brand{color:white;text-decoration:none;font-weight:900}.brand small{display:block;color:#7f8999;font-size:10px}nav{display:flex;gap:6px;flex-wrap:wrap}nav a{color:#98a2b2;text-decoration:none;padding:9px 12px;border-radius:9px}nav a:hover{background:var(--a);color:#fff}main{max-width:1180px;margin:auto;padding:60px 5vw}h1{font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.06em;margin:0 0 15px}p{color:#9ca5b4;line-height:1.7}.heroimg{height:190px;border-radius:18px;background:linear-gradient(135deg,var(--a),#151922);display:grid;place-items:center;font-size:70px;margin:25px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:28px 0}.grid>div,.card,.balance{background:#0f1218;border:1px solid #29303a;border-radius:16px;padding:20px}.grid b,.balance b{display:block;font-size:30px;margin-top:9px}.list{border:1px solid #29303a;border-radius:16px;overflow:hidden;margin-top:18px}.list>div{padding:15px 18px;border-bottom:1px solid #252b34;display:flex;justify-content:space-between;gap:12px}.chart{height:270px;display:flex;align-items:end;gap:7px;margin:25px 0}.chart i{flex:1;background:var(--a);border-radius:5px 5px 0 0}button{border:0;background:var(--a);color:#fff;padding:10px 14px;border-radius:9px;font-weight:800;cursor:pointer;margin:5px 4px 5px 0}input,select,textarea{display:block;width:100%;background:#0a0d12;border:1px solid #303744;color:#fff;border-radius:9px;padding:11px;margin:7px 0 14px}pre{color:#bfc8d5;white-space:pre-wrap}@media(max-width:760px){header{flex-direction:column;align-items:flex-start}.grid{grid-template-columns:1fr}main{padding:40px 5vw}}</style></head><body><header><a class="brand" href="?view=0">◉ Stockroom<small>LOCAL DEMO · NO DATABASE</small></a><nav><a href="?view=0">Overview</a><a href="?view=1">Products</a><a href="?view=2">Categories</a><a href="?view=3">Low Stock</a></nav></header><main id="app"></main><script>let products=JSON.parse(localStorage.products||'[{"id":1,"name":"Wireless Mouse","cat":"Accessories","stock":48},{"id":2,"name":"Keyboard","cat":"Accessories","stock":6},{"id":3,"name":"USB-C Hub","cat":"Devices","stock":31}]');function save(){localStorage.products=JSON.stringify(products)}function render(){let v=+(new URLSearchParams(location.search).get('view')||0);app.innerHTML=v===0?'<h1>Everything in stock.</h1><div class="grid"><div><small>PRODUCTS</small><b>'+products.length+'</b></div><div><small>UNITS</small><b>'+products.reduce((a,x)=>a+x.stock,0)+'</b></div><div><small>LOW STOCK</small><b>'+products.filter(x=>x.stock<10).length+'</b></div></div>':v===1?'<h1>Products</h1><form onsubmit="return addP(event)"><input id="pn" placeholder="Product" required><input id="pc" placeholder="Category" required><input id="ps" type="number" placeholder="Stock" required><button>Add product</button></form><section class="list">'+products.map((p,i)=>'<div>'+p.name+' · '+p.cat+' · '+p.stock+' <button onclick="adjust('+i+',1)">+1</button><button onclick="adjust('+i+',-1)">-1</button><button onclick="products.splice('+i+',1);save();render()">Delete</button></div>').join('')+'</section>':v===2?'<h1>Categories</h1><div class="grid">'+[...new Set(products.map(x=>x.cat))].map(c=>'<div><b>'+c+'</b><p>'+products.filter(x=>x.cat===c).length+' products</p></div>').join('')+'</div>':'<h1>Low Stock</h1>'+products.filter(x=>x.stock<10).map(p=>'<div class="card">'+p.name+' · '+p.stock+' left <button onclick="p.stock+=10;save();render()">Restock +10</button></div>').join('')||'<p>All stock levels are healthy.</p>'}function addP(e){e.preventDefault();products.push({id:Date.now(),name:pn.value,cat:pc.value,stock:+ps.value});save();render();return false}function adjust(i,n){products[i].stock=Math.max(0,products[i].stock+n);save();render()}render();</script></body></html>
